# A disposable WordPress for the HTTP test suite, managed by bin/test-site. See README > Development > Tests.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${ACCEPT_MARKDOWN_WORDPRESS_IMAGE:-php8.4-apache}
    ports:
      - "${ACCEPT_MARKDOWN_TEST_PORT:-8080}:80"
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ..:/var/www/html/wp-content/plugins/accept-markdown:ro
    depends_on:
      db:
        condition: service_healthy

  # wp-cli against the same files and database, as www-data so it can write mu-plugins and .htaccess.
  cli:
    image: wordpress:${ACCEPT_MARKDOWN_CLI_IMAGE:-cli-php8.4}
    user: "33:33"
    environment:
      <<: *wp-env
      ACCEPT_MARKDOWN_TEST_PASSWORD: ${ACCEPT_MARKDOWN_TEST_PASSWORD:-}
    volumes: *wp-volumes
    depends_on:
      wordpress:
        condition: service_started

volumes:
  wordpress:
